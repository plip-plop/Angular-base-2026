<app-menu />

<main class="py-4 container">
  <header
    class="p-4 mb-4 rounded-3"
    (mouseenter)="toggleIsHovered()"
    (mouseleave)="toggleIsHovered()"
    [class.bg-info]="isHovered"
  >
    <h1>Bienvenue sur Zenika</h1>
    <p>Votre panier s'élève à {{ total() }} €</p>
    <p class="mb-0"><a class="btn btn-primary btn-large">Voir mon panier</a></p>
  </header>

  <h2 class="h4">Catalogue</h2>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
    @if (hasProductsInStock()) {
      @for (product of products(); track product.id) {
        @if (product.stock) {
          <div class="col">
            <app-product-card [product]="product" (addToBasket)="ajouterPanier($event)" />
          </div>
        }
      }
    } @else {
      <p>Stock vide !</p>
    }
  </div>
</main>
